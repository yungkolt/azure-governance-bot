[project]
name = "azure-governance-bot"
version = "0.1.0"
description = "Serverless Azure governance & FinOps scanner (Azure Functions + Resource Graph + Teams)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # allow assert in tests
